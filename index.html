<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>व्यवसाय रेकर्ड किपिंग सिस्टम</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>व्यवसाय रेकर्ड किपिंग सिस्टम</h1>
                <p>आफ्नो खातामा लगइन गर्नुहोस्</p>
            </div>
            <div id="loginAlert" class="alert alert-danger hidden"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">प्रयोगकर्ता नाम</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">पासवर्ड</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">लगइन गर्नुहोस्</button>
            </form>
            <div class="text-center mt-3">
                <a href="#" id="forgotPasswordLink">पासवर्ड बिर्सनुभयो?</a>
            </div>
            <div class="text-center mt-4">
                <p>खाता छैन? <a href="#" id="registerLink">नयाँ खाता बनाउनुहोस्</a></p>
            </div>
        </div>
    </div>

    <!-- Modal for Password Reset -->
    <div id="passwordResetModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">पासवर्ड रिसेट</h2>
                <button class="close" id="closePasswordModal">&times;</button>
            </div>
            <div class="modal-body">
                <div id="resetAlert" class="alert alert-danger hidden"></div>
                <form id="passwordResetForm">
                    <div class="form-group">
                        <label for="resetUsername">प्रयोगकर्ता नाम</label>
                        <input type="text" id="resetUsername" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">नयाँ पासवर्ड</label>
                        <input type="password" id="newPassword" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">पासवर्ड पुष्टि गर्नुहोस्</label>
                        <input type="password" id="confirmPassword" class="form-control" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button id="resetPasswordBtn" class="btn btn-primary">पासवर्ड परिवर्तन गर्नुहोस्</button>
            </div>
        </div>
    </div>

    <div class="dashboard-container">
        <!-- मोबाइल साइडबार टगल बटन -->
        <button id="mobileToggle" class="mobile-toggle">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
