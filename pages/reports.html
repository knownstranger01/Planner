    <script>
        // जब पेज लोड हुन्छ
        document.addEventListener('DOMContentLoaded', function() {
            // रिपोर्ट जेनरेट गर्ने बटन क्लिक गर्दा
            document.getElementById('generateReportBtn').addEventListener('click', function() {
                generateReport();
            });

            // प्रिन्ट बटन क्लिक गर्दा
            document.getElementById('printReportBtn').addEventListener('click', function() {
                window.print();
            });

            // PDF मा एक्सपोर्ट गर्ने बटन क्लिक गर्दा
            document.getElementById('exportPdfBtn').addEventListener('click', function() {
                exportToPDF();
            });

            // Excel मा एक्सपोर्ट गर्ने बटन क्लिक गर्दा
            document.getElementById('exportExcelBtn').addEventListener('click', function() {
                exportToExcel();
            });

            // थप जाभास्क्रिप्ट कोड यहाँ थप गर्नुहोस्...
        });

        // PDF मा एक्सपोर्ट गर्ने फंक्शन
        function exportToPDF() {
            // लोडिङ मेसेज प्रदर्शन
            showLoading('PDF तयार हुँदैछ...');

            // रिपोर्ट कन्टेनर प्राप्त गर्ने
            const reportContainer = document.getElementById('reportContainer');
            
            // html2pdf अप्सनहरू
            const opt = {
                margin: 10,
                filename: 'report.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // PDF एक्सपोर्ट गर्ने
            html2pdf().from(reportContainer).set(opt).save().then(() => {
                // लोडिङ हटाउने
                hideLoading();
            }).catch(err => {
                console.error('PDF export error:', err);
                hideLoading();
                alert('PDF बनाउँदा समस्या आयो। पुन: प्रयास गर्नुहोस्।');
            });
        }

        // Excel मा एक्सपोर्ट गर्ने फंक्शन
        function exportToExcel() {
            // लोडिङ मेसेज प्रदर्शन
            showLoading('Excel तयार हुँदैछ...');

            // तालिका प्राप्त गर्ने
            const table = document.getElementById('reportTable');
            if (!table) {
                hideLoading();
                alert('एक्सपोर्ट गर्न तालिका फेला परेन।');
                return;
            }

            // रिपोर्ट शीर्षक र मिति अवधि
            const reportTitle = document.getElementById('reportTitle').innerText;
            const dateRange = document.getElementById('reportDateRange').innerText;

            try {
                // नयाँ वर्कबुक बनाउने
                const wb = XLSX.utils.book_new();
                
                // HTML तालिकाबाट वर्कशीट बनाउने
                const ws = XLSX.utils.table_to_sheet(table);
                
                // वर्कशीट अप्सनहरू सेट गर्ने
                ws['!cols'] = Array(table.rows[0].cells.length).fill({ wch: 15 });
                
                // वर्कबुकमा वर्कशीट थप्ने
                XLSX.utils.book_append_sheet(wb, ws, reportTitle);
                
                // फाइल डाउनलोड गर्ने
                XLSX.writeFile(wb, reportTitle + '.xlsx');
                
                // लोडिङ हटाउने
                hideLoading();
            } catch (err) {
                console.error('Excel export error:', err);
                hideLoading();
                alert('Excel बनाउँदा समस्या आयो। पुन: प्रयास गर्नुहोस्।');
            }
        }

        // लोडिङ मेसेज प्रदर्शन गर्ने फंक्शन
        function showLoading(message) {
            // लोडिङ डिभ बनाउने
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loadingMessage';
            loadingDiv.style.position = 'fixed';
            loadingDiv.style.top = '0';
            loadingDiv.style.left = '0';
            loadingDiv.style.width = '100%';
            loadingDiv.style.height = '100%';
            loadingDiv.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
            loadingDiv.style.display = 'flex';
            loadingDiv.style.justifyContent = 'center';
            loadingDiv.style.alignItems = 'center';
            loadingDiv.style.zIndex = '9999';
            
            // लोडिङ मेसेज कन्टेनर
            const messageContainer = document.createElement('div');
            messageContainer.style.backgroundColor = 'white';
            messageContainer.style.padding = '20px';
            messageContainer.style.borderRadius = '5px';
            messageContainer.style.textAlign = 'center';
            
            // स्पिनर आइकन
            const spinner = document.createElement('div');
            spinner.className = 'spinner-border text-primary';
            spinner.setAttribute('role', 'status');
            
            // लोडिङ टेक्स्ट
            const loadingText = document.createElement('div');
            loadingText.textContent = message || 'कृपया पर्खनुहोस्...';
            loadingText.style.marginTop = '10px';
            
            // सबै एलिमेन्टहरू एक-अर्काभित्र थप्ने
            messageContainer.appendChild(spinner);
            messageContainer.appendChild(loadingText);
            loadingDiv.appendChild(messageContainer);
            document.body.appendChild(loadingDiv);
        }

        // लोडिङ मेसेज हटाउने फंक्शन
        function hideLoading() {
            const loadingDiv = document.getElementById('loadingMessage');
            if (loadingDiv) {
                document.body.removeChild(loadingDiv);
            }
        }

        // रिपोर्ट जेनरेट गर्ने फंक्शन (यो फंक्शन तपाईंको अवस्थाअनुसार परिमार्जन गर्न सक्नुहुन्छ)
        function generateReport() {
            // रिपोर्ट प्रकार र अवधि प्राप्त गर्ने
            const reportType = document.getElementById('reportType').value;
            const reportPeriod = document.getElementById('reportPeriod').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            // यहाँ तपाईंको रिपोर्ट जेनरेट गर्ने तर्क थप्न सक्नुहुन्छ...
            
            // उदाहरणका लागि, रिपोर्ट कन्टेनर देखाउने
            document.getElementById('reportContainer').classList.remove('d-none');
            
            // रिपोर्ट शीर्षक सेट गर्ने
            let reportTitle = '';
            switch(reportType) {
                case 'profit-loss': reportTitle = 'नाफा-नोक्सान विवरण'; break;
                case 'balance-sheet': reportTitle = 'ब्यालेन्स सिट'; break;
                case 'sales': reportTitle = 'बिक्री प्रतिवेदन'; break;
                case 'purchases': reportTitle = 'खरिद प्रतिवेदन'; break;
                case 'inventory': reportTitle = 'इन्भेन्टरी प्रतिवेदन'; break;
                case 'tax': reportTitle = 'कर प्रतिवेदन'; break;
                case 'customer': reportTitle = 'ग्राहक बाँकी प्रतिवेदन'; break;
                case 'vendor': reportTitle = 'विक्रेता बाँकी प्रतिवेदन'; break;
            }
            document.getElementById('reportTitle').textContent = reportTitle;
            
            // रिपोर्ट तालिका उदाहरण डाटा
            generateSampleReportData(reportType);
        }

        // उदाहरण रिपोर्ट डाटा तयार गर्ने फंक्शन (परीक्षण प्रयोजनका लागि)
        function generateSampleReportData(reportType) {
            const table = document.getElementById('reportTable');
            
            // नमूना डाटा बनाउने
            let headers, data;
            
            switch(reportType) {
                case 'profit-loss':
                    headers = ['विवरण', 'रकम (रू.)'];
                    data = [
                        ['आम्दानी', ''],
                        ['बिक्री', '125,000.00'],
                        ['सेवा आम्दानी', '45,000.00'],
                        ['अन्य आम्दानी', '5,000.00'],
                        ['कुल आम्दानी', '175,000.00'],
                        ['', ''],
                        ['खर्च', ''],
                        ['सामान खरिद', '85,000.00'],
                        ['तलब', '30,000.00'],
                        ['भाडा', '15,000.00'],
                        ['विद्युत/पानी', '5,000.00'],
                        ['अन्य खर्च', '10,000.00'],
                        ['कुल खर्च', '145,000.00'],
                        ['', ''],
                        ['कर अघिको नाफा', '30,000.00'],
                        ['कर (13%)', '3,900.00'],
                        ['खुद नाफा', '26,100.00']
                    ];
                    break;
                    
                case 'sales':
                    headers = ['मिति', 'बिल नं.', 'ग्राहक', 'रकम (रू.)', 'कर (रू.)', 'कुल रकम (रू.)'];
                    data = [
                        ['2023-01-05', 'INV-001', 'राम शर्मा', '5,000.00', '650.00', '5,650.00'],
                        ['2023-01-12', 'INV-002', 'सीता थापा', '8,500.00', '1,105.00', '9,605.00'],
                        ['2023-01-18', 'INV-003', 'हरि पौडेल', '12,000.00', '1,560.00', '13,560.00'],
                        ['2023-01-25', 'INV-004', 'अनिल श्रेष्ठ', '7,500.00', '975.00', '8,475.00'],
                        ['2023-02-02', 'INV-005', 'सुमन खड्का', '9,200.00', '1,196.00', '10,396.00'],
                        ['2023-02-10', 'INV-006', 'मनिषा बस्नेत', '6,800.00', '884.00', '7,684.00'],
                        ['2023-02-15', 'INV-007', 'बिमल तामाङ', '11,500.00', '1,495.00', '12,995.00'],
                        ['2023-02-22', 'INV-008', 'रेखा अधिकारी', '4,500.00', '585.00', '5,085.00'],
                    ];
                    break;
                    
                default:
                    headers = ['विवरण', 'मूल्य'];
                    data = [['नमूना डाटा', '0.00']];
            }
            
            // तालिका तयार गर्ने
            let tableHTML = '<thead><tr>';
            headers.forEach(header => {
                tableHTML += `<th>${header}</th>`;
            });
            tableHTML += '</tr></thead><tbody>';
            
            data.forEach(row => {
                tableHTML += '<tr>';
                row.forEach(cell => {
                    tableHTML += `<td>${cell}</td>`;
                });
                tableHTML += '</tr>';
            });
            
            tableHTML += '</tbody>';
            table.innerHTML = tableHTML;
            
            // चार्ट तयार गर्ने
            if (reportType === 'profit-loss') {
                renderChart1([
                    ['आम्दानी', 175000],
                    ['खर्च', 145000],
                    ['नाफा', 30000]
                ]);
                
                renderChart2([
                    ['बिक्री', 125000],
                    ['सेवा आम्दानी', 45000],
                    ['अन्य आम्दानी', 5000]
                ]);
            } else if (reportType === 'sales') {
                renderChart1([
                    ['जनवरी', 35000],
                    ['फेब्रुअरी', 32000],
                    ['मार्च', 28000],
                    ['अप्रिल', 22000],
                    ['मे', 30000],
                    ['जुन', 40000],
                ]);
            }
        }
        
        // चार्ट 1 रेन्डर गर्ने फंक्शन
        function renderChart1(data) {
            const ctx = document.getElementById('reportChart1').getContext('2d');
            
            // पुरानो चार्ट हटाउने
            if (window.chart1) {
                window.chart1.destroy();
            }
            
            const labels = data.map(item => item[0]);
            const values = data.map(item => item[1]);
