<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कारोबारहरू - व्यवसाय रेकर्ड किपिंग सिस्टम</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2 id="sidebarCompanyName">कम्पनी नाम</h2>
            </div>
            <div class="sidebar-menu">
                <a href="dashboard.html" class="sidebar-menu-item">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>ड्यासबोर्ड</span>
                </a>
                <a href="customers.html" class="sidebar-menu-item">
                    <i class="fas fa-users"></i>
                    <span>ग्राहकहरू</span>
                </a>
                <a href="vendors.html" class="sidebar-menu-item">
                    <i class="fas fa-truck"></i>
                    <span>विक्रेताहरू</span>
                </a>
                <a href="transactions.html" class="sidebar-menu-item active">
                    <i class="fas fa-exchange-alt"></i>
                    <span>कारोबारहरू</span>
                </a>
                <a href="journal.html" class="sidebar-menu-item">
                    <i class="fas fa-book"></i>
                    <span>जर्नल इन्ट्रीहरू</span>
                </a>
                <a href="invoices.html" class="sidebar-menu-item">
                    <i class="fas fa-file-invoice"></i>
                    <span>बिलहरू र भुक्तानीहरू</span>
                </a>
                <a href="inventory.html" class="sidebar-menu-item">
                    <i class="fas fa-boxes"></i>
                    <span>इन्भेन्टरी व्यवस्थापन</span>
                </a>
                <a href="reports.html" class="sidebar-menu-item">
                    <i class="fas fa-chart-bar"></i>
                    <span>रिपोर्टहरू</span>
                </a>
                <a href="settings.html" class="sidebar-menu-item">
                    <i class="fas fa-cog"></i>
                    <span>सेटिङहरू</span>
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="top-bar">
                <h1>कारोबारहरू</h1>
                <div class="user-actions d-flex align-items-center">
                    <!-- Company Switcher Dropdown -->
                    <div class="dropdown me-3">
                        <button class="btn btn-outline-primary dropdown-toggle" type="button" id="companyDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-building me-1"></i>
                            <span id="currentCompanyName">कम्पनी नाम</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" id="companyDropdownMenu" aria-labelledby="companyDropdown">
                            <!-- कम्पनीहरू यहाँ लोड हुनेछन् -->
                            <li><a class="dropdown-item" href="create-company.html"><i class="fas fa-plus me-2"></i> नयाँ कम्पनी थप्नुहोस्</a></li>
                            <li><hr class="dropdown-divider"></li>
                        </ul>
                    </div>
                    
                    <!-- User Dropdown -->
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-user me-1"></i>
                            <span id="currentUsername">प्रयोगकर्ता</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="settings.html#profile"><i class="fas fa-user-cog me-2"></i> प्रोफाइल</a></li>
                            <li><a class="dropdown-item" href="settings.html#security"><i class="fas fa-shield-alt me-2"></i> सुरक्षा</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i> लगआउट</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div>फिल्टरहरू</div>
                    <button id="applyFilterBtn" class="btn btn-sm btn-primary">फिल्टर लागू गर्नुहोस्</button>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="filterStartDate" class="form-label">सुरु मिति</label>
                                <input type="date" class="form-control" id="filterStartDate">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="filterEndDate" class="form-label">अन्तिम मिति</label>
                                <input type="date" class="form-control" id="filterEndDate">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="filterType" class="form-label">प्रकार</label>
                                <select class="form-select" id="filterType">
                                    <option value="">सबै प्रकारहरू</option>
                                    <option value="income">आम्दानी</option>
                                    <option value="expense">खर्च</option>
                                    <option value="transfer">स्थानान्तरण</option>
                                    <option value="sale">बिक्री</option>
                                    <option value="purchase">खरीद</option>
                                    <option value="payment">भुक्तानी</option>
                                    <option value="receipt">रसिद</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div>कारोबारहरू</div>
                    <button id="addTransactionBtn" class="btn btn-primary">
                        <i class="fas fa-plus"></i> नयाँ कारोबार थप्नुहोस्
                    </button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>मिति</th>
                                    <th>विवरण</th>
                                    <th>प्रकार</th>
                                    <th>रकम</th>
                                    <th>खाता</th>
                                    <th>कार्यहरू</th>
                                </tr>
                            </thead>
                            <tbody id="transactionTableBody">
                                <!-- कारोबारहरू यहाँ लोड हुनेछन् -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Adding Transaction -->
    <div class="modal fade" id="addTransactionModal" tabindex="-1" aria-labelledby="addTransactionModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addTransactionModalLabel">नयाँ कारोबार थप्नुहोस्</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addTransactionForm">
                        <div class="mb-3">
                            <label for="transactionDate" class="form-label">मिति *</label>
                            <input type="date" class="form-control" id="transactionDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="transactionType" class="form-label">प्रकार *</label>
                            <select class="form-select" id="transactionType" required>
                                <option value="">प्रकार छान्नुहोस्</option>
                                <option value="income">आम्दानी</option>
                                <option value="expense">खर्च</option>
                                <option value="transfer">स्थानान्तरण</option>
                                <option value="sale">बिक्री</option>
                                <option value="purchase">खरीद</option>
                                <option value="payment">भुक्तानी</option>
                                <option value="receipt">रसिद</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="transactionAmount" class="form-label">रकम *</label>
                            <div class="input-group">
                                <span class="input-group-text" id="currencySymbol">रू</span>
                                <input type="number" class="form-control" id="transactionAmount" placeholder="0.00" step="0.01" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="transactionAccount" class="form-label">खाता</label>
                            <select class="form-select" id="transactionAccount">
                                <option value="cash">नगद</option>
                                <option value="bank">बैंक</option>
                                <option value="credit_card">क्रेडिट कार्ड</option>
                                <option value="other">अन्य</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="transactionCategory" class="form-label">श्रेणी</label>
                            <input type="text" class="form-control" id="transactionCategory" placeholder="श्रेणी वा विवरण">
                        </div>
                        <div class="mb-3">
                            <label for="transactionNote" class="form-label">नोट</label>
                            <textarea class="form-control" id="transactionNote" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">रद्द गर्नुहोस्</button>
                    <button type="button" class="btn btn-primary" id="saveTransactionBtn">सेभ गर्नुहोस्</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/database.js"></script>
    <script src="../js/transactions.js"></script>
</body>
</html>
